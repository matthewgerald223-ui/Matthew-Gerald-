<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ekpah Matthew | Web Developer & Cybersecurity Student</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            line-height: 1.6;
            padding: 20px 10px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* Header / Name Banner */
        header {
            text-align: center;
            padding: 25px 15px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        h1 {
            color: #58a6ff;
            font-size: 28px;
            margin-bottom: 6px;
        }

        .tagline {
            color: #8b949e;
            font-size: 15px;
            font-weight: 500;
        }

        /* Slideshow Styling */
        .slideshow-container {
            position: relative;
            max-width: 100%;
            margin: 20px 0;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #30363d;
            background: #000;
        }

        .mySlides {
            display: none;
        }

        .mySlides img {
            width: 100%;
            height: auto;
            display: block;
        }

        .prev, .next {
            cursor: pointer;
            position: absolute;
            top: 50%;
            padding: 12px 16px;
            margin-top: -22px;
            color: white;
            font-weight: bold;
            font-size: 18px;
            border-radius: 6px;
            user-select: none;
            background-color: rgba(13, 17, 23, 0.7);
            border: 1px solid #30363d;
        }

        .next {
            right: 10px;
        }

        .prev {
            left: 10px;
        }

        .prev:hover, .next:hover {
            background-color: #238636;
            color: #fff;
        }

        /* Portfolio Cards */
        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .card h2 {
            color: #238636;
            font-size: 20px;
            margin-bottom: 12px;
            border-bottom: 1px solid #21262d;
            padding-bottom: 8px;
        }

        /* Skills Tags */
        .skills-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }

        .skill-tag {
            background: #21262d;
            border: 1px solid #30363d;
            color: #58a6ff;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        /* Project List */
        .project-box {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 12px;
        }

        .project-title {
            color: #58a6ff;
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 4px;
        }

        /* Contact Grid */
        .contact-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 10px;
            margin-top: 12px;
        }

        .contact-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 10px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .contact-btn:hover {
            border-color: #58a6ff;
            color: #58a6ff;
            background: #161b22;
        }

        footer {
            text-align: center;
            padding: 15px;
            color: #8b949e;
            font-size: 13px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
